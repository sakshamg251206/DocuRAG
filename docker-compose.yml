# Full local stack: Ollama (LLM) + DocuRAG API + web UI.
#   docker compose up --build      → open http://localhost:8501
# The first start downloads the LLM (~2 GB) and the embedding model (~90 MB).

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job that makes sure the configured model is downloaded.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-llama3.2:3b}"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      CORS_ORIGINS: http://localhost:8501
    volumes:
      - documents:/app/data
      - hf-cache:/home/app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      DOCURAG_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ollama:
  documents:
  hf-cache:
